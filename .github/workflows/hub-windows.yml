# The core exe's Windows build (windows-release.yml, 3.7b in PLAN.md): movement-kit.exe, the hub, movekit
# and the HUD settings, with the tools as modules it downloads (hub/build.py). Smoke-tested by
# hub/smoke_test.py, which installs the modules from a fake GitHub and runs them from the download
# folder, then started with no arguments, which must keep the hub window up. Zipped with WINDOWS.txt,
# the licences of the bundled packages (third-party-licenses, read from the build's own metadata) and
# the other notices. Run by hand (Actions > hub-windows > Run workflow) for a test build, kept as a
# workflow artifact; a pushed hub-v* tag also attaches the zip to that tag's GitHub release.
name: hub-windows
on:
  workflow_dispatch:
  push:
    tags: ["hub-v*"]
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/windows-release.yml
    with:
      tool: hub
      title: Soulmanyes's Movement Kit
      exe: movement-kit
      packages: pywebview
      licenses_of: pywebview
      build: python build.py
      # a one-file exe runs as a bootloader plus a child, so taskkill /T ends both
      smoke: >-
        python smoke_test.py dist/movement-kit.exe;
        if ($LASTEXITCODE) { exit $LASTEXITCODE };
        $p = Start-Process dist/movement-kit.exe -PassThru; Start-Sleep 15;
        if ($p.HasExited) { Write-Error "movement-kit.exe exited with $($p.ExitCode)"; exit 1 };
        taskkill /F /T /PID $p.Id
      files: WINDOWS.txt, LICENSE, THIRD-PARTY-NOTICES.txt, licenses/OpenSSL-LICENSE.txt, licenses/expat-LICENSE.txt, licenses/WebView2-LICENSE.txt, licenses/WebView2-NOTICE.txt
      version: python ../.github/scripts/version.py hub
