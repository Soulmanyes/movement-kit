# The shared Windows build for the kit's tools, called by one small workflow per tool. PyInstaller
# can't cross-build, so it runs on windows-latest: build the exe, smoke-test it, zip it with the
# tool's files and the licence of the Python build bundled in the exe, and keep the zip as a workflow
# artifact. On a pushed <tool>-v* tag it also attaches the zip to that tag's GitHub release.
# Every run step runs in the tool's folder (or `folder`), in PowerShell unless it says otherwise.
name: windows-release
on:
  workflow_call:
    inputs:
      tool:
        description: The tool's folder and tag prefix, "strafe-review" for strafe-review-v1.4.0
        type: string
        required: true
      title:
        description: The release title before the version, "Strafe Review"
        type: string
        required: true
      build:
        description: Command that builds dist/<tool>.exe
        type: string
        required: true
      smoke:
        description: Command that tests the built exe and fails on a problem
        type: string
        required: true
      files:
        description: Comma-separated paths zipped next to the exe, from the tool's folder
        type: string
        required: true
      version:
        description: Command that prints the tool's VERSION; the tag must match it. Empty skips the check
        type: string
        default: ""
      folder:
        description: >-
          The folder the build runs in when it isn't the tool's: "hub" for the bridge release, which
          builds the core exe on Strafe Review's tag line (strafe-review-windows.yml)
        type: string
        default: ""
      exe:
        description: The exe's name without .exe when it isn't the tool's, "movement-kit" for the hub
        type: string
        default: ""
      packages:
        description: Space-separated pip packages the build bundles, installed next to PyInstaller
        type: string
        default: ""
      licenses_of:
        description: >-
          Space-separated packages whose licence files (and their requirements') go in licenses/ in
          the zip, read from the installed metadata (.github/scripts/collect_licenses.py)
        type: string
        default: ""
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.folder || inputs.tool }}
        shell: pwsh
    env:
      TOOL: ${{ inputs.tool }}
      TITLE: ${{ inputs.title }}
      BUILD: ${{ inputs.build }}
      SMOKE: ${{ inputs.smoke }}
      FILES: ${{ inputs.files }}
      VERSION_CMD: ${{ inputs.version }}
      EXE: ${{ inputs.exe || inputs.tool }}
      PACKAGES: ${{ inputs.packages }}
      LICENSES_OF: ${{ inputs.licenses_of }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every tag, for the release notes' start tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyinstaller "$env:PACKAGES".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
      - name: Licences of the bundled packages
        if: inputs.licenses_of != ''
        run: python ../.github/scripts/collect_licenses.py third-party-licenses "$env:LICENSES_OF".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
      - name: Build
        run: Invoke-Expression $env:BUILD; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test
        run: Invoke-Expression $env:SMOKE; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        timeout-minutes: 5
      - name: Zip
        run: |
          python -c "import shutil, sys, pathlib; shutil.copy(pathlib.Path(sys.base_prefix) / 'LICENSE.txt', 'PYTHON-LICENSE.txt')"
          $paths = @("dist/$env:EXE.exe", "PYTHON-LICENSE.txt") + ($env:FILES -split ',' | ForEach-Object { $_.Trim() })
          if ($env:LICENSES_OF) { $paths += "third-party-licenses" }
          Compress-Archive -Path $paths -DestinationPath "$env:TOOL-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tool }}-windows
          path: ${{ inputs.folder || inputs.tool }}/${{ inputs.tool }}-windows.zip  # upload paths start at the repo root
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF_NAME in "$TOOL"-v*) ;; *) echo "tag $GITHUB_REF_NAME isn't a $TOOL-v* tag"; exit 1 ;; esac
          version=${GITHUB_REF_NAME#"$TOOL"-v}
          # a tag that isn't VERSION would make every copy see an update that never takes
          if [ -n "$VERSION_CMD" ]; then
            have=$(eval "$VERSION_CMD" | tr -d '\r')
            if [ "$version" != "$have" ]; then echo "tag $GITHUB_REF_NAME but VERSION $have"; exit 1; fi
          fi
          # notes from this tool's previous tag, not whichever tool released last
          prev=$(git tag -l "$TOOL-v*" --sort=v:refname | grep -x -B1 "$GITHUB_REF_NAME" | grep -vx "$GITHUB_REF_NAME" || true)
          zip=$TOOL-windows.zip
          # the notes are the tag's message; GitHub's generated ones only for a tag without one
          sh .github/scripts/tag-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else notes=(--generate-notes ${prev:+--notes-start-tag "$prev"}); fi
          gh release create "$GITHUB_REF_NAME" "$zip" --title "$TITLE $version" "${notes[@]}" \
            || gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
