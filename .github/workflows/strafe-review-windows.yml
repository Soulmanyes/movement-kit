# The bridge release on Strafe Review's line (windows-release.yml, 3.7b in PLAN.md): the core exe
# (hub/build.py), named strafe-review.exe and zipped as strafe-review-windows.zip, so installed
# Strafe Review exes update themselves into the kit's core. Its first start installs the Strafe
# Review module (hub/movement_kit.py migrate()). Smoke-tested like hub-windows.yml. The tag's
# strafe-review-module.zip comes from module-release.yml. Run by hand (Actions >
# strafe-review-windows > Run workflow) for a test build; a pushed strafe-review-v* tag attaches the
# zip to that tag's GitHub release. The tag must match Strafe Review's VERSION.
name: strafe-review-windows
on:
  workflow_dispatch:
  push:
    tags: ["strafe-review-v*"]
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/windows-release.yml
    with:
      tool: strafe-review
      folder: hub
      title: Strafe Review
      exe: strafe-review
      packages: pywebview
      licenses_of: pywebview
      build: python build.py --name strafe-review
      smoke: >-
        python smoke_test.py dist/strafe-review.exe;
        if ($LASTEXITCODE) { exit $LASTEXITCODE };
        $p = Start-Process dist/strafe-review.exe -PassThru; Start-Sleep 15;
        if ($p.HasExited) { Write-Error "strafe-review.exe exited with $($p.ExitCode)"; exit 1 };
        taskkill /F /T /PID $p.Id
      files: WINDOWS.txt, LICENSE, THIRD-PARTY-NOTICES.txt, licenses/OpenSSL-LICENSE.txt, licenses/expat-LICENSE.txt, licenses/WebView2-LICENSE.txt, licenses/WebView2-NOTICE.txt
      version: python ../.github/scripts/version.py strafe-review
