# Gain Converter's Windows build (windows-release.yml): the exe, zipped with the licences (Tcl's and
# Tk's in licenses/). Run by hand (Actions > gain-converter-windows > Run workflow) for a test build,
# kept as a workflow artifact; a pushed gain-converter-v* tag also attaches the zip to that tag's
# GitHub release.
name: gain-converter-windows
on:
  workflow_dispatch:
  push:
    tags: ["gain-converter-v*"]
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/windows-release.yml
    with:
      tool: gain-converter
      title: Gain Converter
      build: python -m PyInstaller --onefile --windowed --noconfirm --clean --name gain-converter gain_converter.py
      # the exe must start and keep its window up; a crash on start ends it at once
      smoke: >-
        $p = Start-Process dist/gain-converter.exe -PassThru; Start-Sleep 8;
        if ($p.HasExited) { Write-Error "gain-converter.exe exited with $($p.ExitCode)"; exit 1 };
        Stop-Process $p
      files: LICENSE, THIRD-PARTY-NOTICES.txt, licenses/TCL-LICENSE.txt, licenses/TK-LICENSE.txt
