<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Source Yaw</title>
<link rel="stylesheet" href="/web/hub.css">
<link rel="stylesheet" href="/web/form.css">
<link rel="stylesheet" href="sy.css">
<script src="/web/hub.js"></script>
<script src="/web/section.js"></script>
</head>
<body>
<nav id="hub-side"></nav>
<main id="hub-main">
	<div class="mk-head">
		<div>
			<h1 id="sy-title">Source Yaw</h1>
			<div id="sy-sub" class="muted"></div>
		</div>
		<button id="sy-apply" class="mk-primary" disabled>Apply</button>
	</div>
	<div id="sy-problem" class="mk-banner" hidden></div>
	<div id="sy-loading" class="muted">Loading…</div>

	<div id="sy-form" hidden>
		<section class="card">
			<h2>Setup</h2>
			<div id="sy-game-row" class="mk-row" hidden>
				<div class="mk-label">Game<div class="muted">Each game has its own settings</div></div>
				<div id="sy-games" class="mk-seg"></div>
			</div>
			<div class="mk-row">
				<label class="mk-label" for="sy-autoexec">Load from autoexec.cfg<div class="muted">Adds exec yaws.cfg to
					your autoexec.cfg, so the game loads your yawspeed binds when it starts</div></label>
				<input id="sy-autoexec" type="checkbox" class="mk-switch">
			</div>
			<div class="mk-row">
				<div class="mk-label">Steam launch options<div id="sy-steam-note" class="muted"></div></div>
				<button id="sy-launch-refresh" title="Read the launch options from Steam again">Refresh</button>
			</div>
			<div class="mk-row">
				<code id="sy-launch" class="mk-launch"></code>
				<button id="sy-launch-copy">Copy</button>
			</div>
			<div id="sy-launch-note" class="muted"></div>
		</section>

		<section class="card">
			<h2>Yaw cycle</h2>
			<div class="mk-row">
				<div class="mk-label">Cycle key<div id="sy-key-note" class="muted"></div></div>
				<span id="sy-key" class="mk-key"></span>
				<button id="sy-key-change">Change…</button>
			</div>
			<div class="mk-row" data-surf>
				<div class="mk-label">Mode key<div id="sy-mode-note" class="muted"></div></div>
				<span id="sy-mode-key" class="mk-key"></span>
				<button id="sy-mode-change">Change…</button>
				<button id="sy-mode-clear" title="No mode key">Clear</button>
			</div>
			<div class="mk-row" data-surf>
				<label class="mk-label" for="sy-auto">Auto by map prefix<div id="sy-auto-note" class="muted"></div></label>
				<input id="sy-auto" type="checkbox" class="mk-switch">
			</div>
			<div class="sy-group-head sy-sub">
				<div><h3>Yawspeeds</h3><div id="sy-entries-note" class="muted"></div></div>
				<button id="sy-add" title="Add a yawspeed">+ Add</button>
			</div>
			<div class="mk-row">
				<label class="mk-label" for="sy-surf-on">Separate surf yawspeeds<div id="sy-surf-note" class="muted"></div></label>
				<input id="sy-surf-on" type="checkbox" class="mk-switch">
			</div>
			<div class="mk-row">
				<div class="mk-label">Editing<div id="sy-active-note" class="muted"></div></div>
				<button id="sy-swap" title="Use the other list in game"></button>
				<div id="sy-tabs" class="mk-seg">
					<button id="sy-tab-bhop" data-tab="bhop">Bhop</button>
					<button id="sy-tab-surf" data-tab="surf">Surf</button>
				</div>
			</div>
			<div id="sy-entries"></div>
		</section>

		<!-- data-linux: hidden on Windows, which has no crosshair colour -->
		<section class="card" data-linux>
			<h2>Crosshair</h2>
			<div class="mk-row">
				<label class="mk-label" for="sy-crosshair">Change crosshair colour<div id="sy-color-note" class="muted"></div></label>
				<input id="sy-crosshair" type="checkbox" class="mk-switch">
			</div>
			<div class="mk-row" data-krosshair>
				<div class="mk-label">Crosshair<div class="muted">Every visible pixel gets the yawspeed's colour,
					so outlines lose their own colour</div></div>
				<select id="sy-base"></select>
			</div>
			<div class="mk-row" data-krosshair>
				<div class="mk-label">KROSSHAIR<div id="sy-krosshair-note" class="muted"></div></div>
				<button id="sy-krosshair-install" hidden>Install</button>
			</div>
		</section>
	</div>
</main>

<script src="sy-page.js"></script>
</body>
</html>
