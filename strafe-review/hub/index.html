<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strafe Review</title>
<link rel="stylesheet" href="/web/hub.css">
<link rel="stylesheet" href="sr.css">
<script src="/web/hub.js"></script>
</head>
<body>
<nav id="hub-side"></nav>
<main id="hub-main">
	<h1>Strafe Review</h1>
	<p class="muted">Records your Momentum Mod attempts and shows them on a review page in the browser.</p>
	<div class="card">
		<div class="sr-head">
			<span id="sr-state" class="sr-state">Checking…</span>
			<span class="sr-buttons">
				<button id="sr-open" class="sr-main" disabled>Open review</button>
				<button id="sr-stop" hidden>Stop</button>
			</span>
		</div>
		<div id="sr-note" class="sr-note muted"></div>
		<div id="sr-rows" class="sr-rows"></div>
	</div>
	<p class="muted">Updates, the auto-update switch and Uninstall are on the <a href="/web/home.html" style="color: var(--accent)">Modules</a> page.</p>
</main>
<script src="sr-page.js"></script>
</body>
</html>
