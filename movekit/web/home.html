<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soulmanyes's Movement Kit</title>
<link rel="stylesheet" href="/web/hub.css">
<script src="/web/hub.js"></script>
<script src="/web/modules.js" defer></script>
</head>
<body>
<nav id="hub-side"></nav>
<main id="hub-main">
	<h1>Modules</h1>
	<div class="mod-top">
		<span id="mod-checked" class="muted"></span>
		<button id="mod-check">Check for updates</button>
		<button id="mod-all" class="primary" hidden>Update all</button>
	</div>
	<div class="card" id="mod-checkout" hidden>
		This copy runs from a git checkout, so <b>git pull</b> updates it. Install and Uninstall still
		put each tool's game files and launch hooks in, or take them out.
	</div>
	<div class="card mod-busy" id="mod-busy" hidden></div>
	<div class="card error" id="mod-page-error" hidden></div>
	<div id="mod-cards"><div class="card"><span class="muted">Loading…</span></div></div>
	<div class="card error" id="home-problems" hidden></div>
</main>
</body>
</html>
