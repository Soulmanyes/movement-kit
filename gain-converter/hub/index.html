<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gain Converter</title>
<link rel="stylesheet" href="/web/hub.css">
<link rel="stylesheet" href="gain.css">
<script src="/web/hub.js"></script>
<script src="/web/gain.js"></script>
</head>
<body>
<nav id="hub-side"></nav>
<main id="hub-main">
	<h1>Gain Converter</h1>
	<div class="gc-switch">
		<button id="gc-from-css" class="gc-css">CS:S → Momentum</button>
		<button id="gc-from-mom" class="gc-mom">Momentum → CS:S</button>
	</div>
	<div class="card gc-input">
		<div id="gc-in-label" class="gc-in-label"></div>
		<div class="gc-row">
			<button id="gc-minus" class="gc-step" title="−1">−</button>
			<input id="gc-box" type="text" inputmode="decimal" autocomplete="off"><span class="gc-unit">%</span>
			<button id="gc-plus" class="gc-step" title="+1">+</button>
		</div>
		<input id="gc-slider" type="range" min="0" max="100" step="0.1">
	</div>
	<div class="gc-result"><div id="gc-result"></div><div id="gc-sub" class="muted"></div></div>
	<div class="card gc-graph"><svg id="gc-graph" role="img" aria-label="Momentum and CS:S gain curves"></svg></div>
	<p class="muted gc-note">An estimate: the two games score gain differently, so no exact conversion exists.
	The curve is fitted to measured runs (white dots). Click or drag on the graph to pick a value.</p>
</main>
<script src="gain-page.js"></script>
</body>
</html>
